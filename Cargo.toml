[package]
name = "Oxidal"
version = "0.8.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = [
    "tree-sitter-languages",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "7.0.0"
keyring = "4.2.0"
secrecy = "0.10.3"
zeroize = "1.9.1"
async-channel = "2"
vte = "0.15.0"
portable-pty = "0.9.0"
russh = "0.65.0"
russh-sftp = "3.0.1"
serialport = "4.10.1"
chrono = "0.4.45"
open = "5.4.5"
sha2 = "0.11"
tokio = { version = "^1", features = [ "rt", "net", "io-util", "time", "fs", "sync", "macros" ] }
ureq = { version = "3.5.0", features = [ "json" ] }
tokio-socks = "0.5.3"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "wayland",
    "x11",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 0
strip = "symbols"
panic = "abort"
incremental = false
overflow-checks = false
debug-assertions = false
