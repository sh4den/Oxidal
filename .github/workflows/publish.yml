name: Build and Publish

on:
  push:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: vars
        run: |
          echo "version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')" >> "$GITHUB_OUTPUT"

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit --deny warnings

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: macos-intel
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: macos-apple-silicon
            runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            pkg-config \
            libudev-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libwayland-dev \
            libpython3-dev \
            libdbus-1-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf "dist/oxidal-v${{ needs.version.outputs.version }}-${{ matrix.name }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" Oxidal
          cp "target/${{ matrix.target }}/release/Oxidal" "dist/Oxidal-${{ matrix.name }}"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/Oxidal.exe" `
            -DestinationPath "dist/oxidal-v${{ needs.version.outputs.version }}-${{ matrix.name }}.zip"
          Copy-Item "target/${{ matrix.target }}/release/Oxidal.exe" "dist/Oxidal-${{ matrix.name }}.exe"

      - name: Build installer (linux)
        if: runner.os == 'Linux'
        run: |
          arch="${{ matrix.name }}"
          bash packaging/linux/make-deb.sh "${{ needs.version.outputs.version }}" \
            "target/${{ matrix.target }}/release/Oxidal" "${arch#linux-}" dist

      - name: Build installer (macos)
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos/make-dmg.sh "${{ needs.version.outputs.version }}" \
            "target/${{ matrix.target }}/release/Oxidal" "${{ matrix.name }}" dist

      - name: Build installer (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $bin = (Resolve-Path "target/${{ matrix.target }}/release/Oxidal.exe").Path
          $out = Join-Path (Get-Location) "dist"
          $arch = "${{ matrix.name }}".Replace("windows-", "")
          & $iscc "/DAppVersion=${{ needs.version.outputs.version }}" "/DArch=$arch" `
            "/DBinPath=$bin" "/O$out" packaging/windows/oxidal.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxidal-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish checksums
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Generate release notes
        run: |
          TAG="v${{ needs.version.outputs.version }}"
          REPO_URL="https://github.com/${{ github.repository }}"

          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          TMP=$(mktemp -d)
          COUNT=0

          while IFS=$'\t' read -r sha short subject; do
            case "$subject" in
              [Bb]ump\ [0-9]*|[Bb]ump\ v[0-9]*|[Uu]pdate\ v[0-9]*|[Rr]elease\ v[0-9]*) continue ;;
              [Uu]pdate\ version*|[Vv]ersion\ [0-9]*|[Vv]ersion\ bump*) continue ;;
            esac

            type=""; scope=""; breaking=""; desc="$subject"
            if [[ "$subject" =~ ^([A-Za-z]+)(\(([^\)]*)\))?(!)?:[[:space:]]*(.*)$ ]]; then
              type=$(printf '%s' "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')
              scope=$(printf '%s' "${BASH_REMATCH[3]}" | tr '[:upper:]' '[:lower:]')
              breaking="${BASH_REMATCH[4]}"
              desc="${BASH_REMATCH[5]}"
            fi

            if [ -n "$scope" ]; then
              line="- **${scope}**: ${desc} ([\`${short}\`](${REPO_URL}/commit/${sha}))"
            else
              line="- ${desc} ([\`${short}\`](${REPO_URL}/commit/${sha}))"
            fi
            COUNT=$((COUNT + 1))

            if [ -n "$breaking" ]; then
              echo "$line" >> "$TMP/breaking"
              continue
            fi

            case "$scope" in
              security|*security*|hardening)  echo "$line" >> "$TMP/security"; continue ;;
              deps|dependencies|dep)          echo "$line" >> "$TMP/deps"; continue ;;
              ci|cd|workflow|workflows|actions|release) echo "$line" >> "$TMP/ci"; continue ;;
            esac

            case "$type" in
              feat|feature|feats)                                echo "$line" >> "$TMP/feat" ;;
              fix|fixes|hotfix|bugfix|bug)                       echo "$line" >> "$TMP/fix" ;;
              security|sec)                                      echo "$line" >> "$TMP/security" ;;
              perf|performance|optim)                            echo "$line" >> "$TMP/perf" ;;
              deps|dep)                                          echo "$line" >> "$TMP/deps" ;;
              docs|doc)                                          echo "$line" >> "$TMP/docs" ;;
              ci|cd|build|packaging|workflow)                    echo "$line" >> "$TMP/ci" ;;
              chore|chores|refactor|style|test|tests|cleanup)    echo "$line" >> "$TMP/maint" ;;
              *)
                case "$subject" in
                  [Bb]ump\ *|[Uu]pgrade\ *)                      echo "$line" >> "$TMP/deps" ;;
                  *README*|*readme*|*LICENSE*|*license*|*doc*)   echo "$line" >> "$TMP/docs" ;;
                  *)                                             echo "$line" >> "$TMP/other" ;;
                esac
                ;;
            esac
          done < <(git log --no-merges --pretty=tformat:"%H%x09%h%x09%s" "$RANGE")

          COMMITS="commits"
          if [ "$COUNT" = "1" ]; then
            COMMITS="commit"
          fi

          BODY=release-notes.md
          {
            echo "## What's Changed"
            echo
            if [ -n "$PREV_TAG" ]; then
              STAT=$(git diff --shortstat "$PREV_TAG..HEAD" | sed 's/^ *//')
              echo "_${COUNT} ${COMMITS} since [\`${PREV_TAG}\`](${REPO_URL}/releases/tag/${PREV_TAG}) — ${STAT}_"
            else
              echo "_${COUNT} ${COMMITS} in the first release_"
            fi
            echo
          } > "$BODY"

          add_section() {
            if [ -s "$2" ]; then
              { echo "### $1"; echo; cat "$2"; echo; } >> "$BODY"
            fi
          }
          add_section "💥 Breaking changes"  "$TMP/breaking"
          add_section "🚀 Features"          "$TMP/feat"
          add_section "🐛 Bug fixes"         "$TMP/fix"
          add_section "🔐 Security"          "$TMP/security"
          add_section "⚡ Performance"       "$TMP/perf"
          add_section "📦 Dependencies"      "$TMP/deps"
          add_section "📚 Documentation"     "$TMP/docs"
          add_section "🏗️ Build & CI"        "$TMP/ci"
          add_section "🧹 Maintenance"       "$TMP/maint"
          add_section "🔀 Other changes"     "$TMP/other"

          CONTRIBUTORS=$(git log --no-merges --pretty=tformat:'%an' "$RANGE" | grep -v '\[bot\]' | sort -u)
          if [ -n "$CONTRIBUTORS" ]; then
            {
              echo "### 👥 Contributors"
              echo
              echo "$CONTRIBUTORS" | sed 's/^/- /'
              echo
            } >> "$BODY"
          fi

          {
            echo "### 📥 Downloads"
            echo
            echo "Installers (Windows setup, macOS dmg, Debian/Ubuntu deb) and portable builds for Windows (x86_64, arm64), Linux (amd64, arm64) and macOS (Intel, Apple Silicon) are attached below."
            echo
            echo "**macOS first launch:** builds are not notarized. If macOS blocks the app, allow it in System Settings > Privacy & Security > \"Open Anyway\", or run:"
            echo
            echo '```'
            echo "xattr -dr com.apple.quarantine /Applications/Oxidal.app"
            echo '```'
            echo
            echo "<details><summary>🔑 SHA256 checksums</summary>"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "</details>"
            echo
          } >> "$BODY"

          if [ -n "$PREV_TAG" ]; then
            echo "**Full Changelog**: ${REPO_URL}/compare/${PREV_TAG}...${TAG}" >> "$BODY"
          else
            echo "**Full Changelog**: ${REPO_URL}/commits/${TAG}" >> "$BODY"
          fi

          echo "--- release notes ---"
          cat "$BODY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: 📦 Release v${{ needs.version.outputs.version }}
          body_path: release-notes.md
          files: dist/*
